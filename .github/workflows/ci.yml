name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build on Sequoia
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fastlane
        run: |
          brew install fastlane
          # Prefer Homebrew's wrapper over the runner's preinstalled Ruby-gem executable.
          echo "$(brew --prefix fastlane)/bin" >> "$GITHUB_PATH"
      - name: Check fastlane installation
        run: |
          command -v fastlane
          fastlane --version
      - name: Check Swift formatting
        run: swift format lint --strict --recursive Package.swift Sources Tests
      - name: Test service and release workflow
        run: fastlane mac test
      - name: Build and verify universal service
        run: fastlane mac build
